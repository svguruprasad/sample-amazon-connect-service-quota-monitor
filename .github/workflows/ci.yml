name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (CKV2_GHA_1): CI only needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - run: ruff check .   # rules pinned in ruff.toml

  cfn-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.56.0
      - run: cfn-lint connect-quota-monitor-cfn.yaml
      - run: cfn-lint live-refresh/template.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          if git grep -nE "AKIA[A-Z0-9]{16}|sk_live_" -- '*.py' '*.json' '*.yaml'; then
            echo "Secret-like string found"; exit 1
          fi
          echo "No secrets found"
      - name: Check for hardcoded account IDs
        run: |
          # git grep's ERE does not support \b, so match the bare 12-digit run and
          # filter known placeholders plus lines containing a GUID (whose final
          # segment is 12 hex and can look like a 12-digit run).
          if git grep -nE "[0-9]{12}" -- '*.py' '*.yaml' \
              | grep -vE "YOUR_ACCOUNT|example|000000000000|123456789012|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}"; then
            echo "Possible hardcoded account ID"; exit 1
          fi
          echo "Clean"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest boto3 moto
      - run: python -m pytest tests/ -v
